[project]
name = "data-structures-handbook"
version = "1.0.0"
description = "Runnable DSA, SQL, and machine-learning practice"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=2.2,<3", "scikit-learn>=1.7,<2", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]
deep-learning = ["numpy>=2.2,<3", "scikit-learn>=1.7,<2", "torch>=2.7,<3"]
retrieval = ["numpy>=2.2,<3", "scikit-learn>=1.7,<2", "torch>=2.7,<3", "sentence-transformers>=5,<6", "transformers>=4.41,<5"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
include = ["**/*.py"]
extend-exclude = [".private", ".venv", "target", "node_modules"]

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["15_machine_learning"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/15_machine_learning"
namespace_packages = true
explicit_package_bases = true
strict = true
exclude = ["(^|/)tests\\.py$"]
